name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Secret scan
        run: pnpm security:scan

      - name: Dependency audit (prod) — informativo
        run: pnpm security:audit
        continue-on-error: true
        # Vulnerabilidades atuais são transitivas do tooling Expo (image-size);
        # monitoradas manualmente — ver docs/THREAT_MODEL.md.

      - name: Dependency audit (critical) — bloqueante
        run: pnpm security:audit --audit-level=critical
        # Novo critical em runtime/prod quebra o CI.

      - name: Test
        run: pnpm test

      - name: Validate migrations (DB-free)
        run: pnpm db:generate

      - name: Check no migration drift
        run: |
          if [ -n "$(git status --porcelain -- packages/db)" ]; then
            echo "Migration drift detected:"
            git status --porcelain -- packages/db
            exit 1
          fi

      - name: Build
        run: pnpm build
