name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Corridas financeiras reais (conexões e processos distintos) não são
      # reproduzíveis no PGlite — ver tests/integration/src/*.pg.test.ts.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Secret scan
        run: pnpm security:scan

      - name: Dependency audit (prod) — informativo
        run: pnpm security:audit
        continue-on-error: true
        # Vulnerabilidades atuais são transitivas do tooling Expo (image-size);
        # monitoradas manualmente — ver docs/THREAT_MODEL.md.

      - name: Dependency audit (critical) — bloqueante
        run: pnpm security:audit --audit-level=critical
        # Novo critical em runtime/prod quebra o CI.

      - name: Test
        run: pnpm test

      # A suíte de backup e restauração usa pg_dump e pg_restore na versão do servidor (17); o
      # runner traz uma versão mais antiga, que recusa ler um banco 17.
      - name: PostgreSQL 17 client (backup e restauração)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump" >> "$GITHUB_ENV"
          echo "PG_RESTORE=/usr/lib/postgresql/17/bin/pg_restore" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Test (PostgreSQL real — concorrência de dinheiro e fila)
        run: pnpm test:pg
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres

      - name: Validate migrations (DB-free)
        run: pnpm db:generate

      - name: Check no migration drift
        run: |
          if [ -n "$(git status --porcelain -- packages/db)" ]; then
            echo "Migration drift detected:"
            git status --porcelain -- packages/db
            exit 1
          fi

      - name: Build
        run: pnpm build

  e2e:
    # Jornada Playwright contra a stack real (API + worker + web, providers FAKE)
    # sobre o serviço postgres; o webServer do Playwright aplica as migrations e
    # sobe tudo.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: aluguei
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_URL: postgresql://postgres@localhost:5432/aluguei
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @aluguei/tests-e2e exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm --filter @aluguei/tests-e2e test:e2e
        env:
          # O contexto `runner` não existe no env do job — o GitHub recusa o
          # arquivo inteiro e nenhum job roda. Nos steps ele existe.
          ALUGUEI_E2E_RUNS: ${{ runner.temp }}/e2e-runs

      - name: Stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-logs
          path: ${{ runner.temp }}/e2e-runs

  image:
    # As imagens da homologação (Dockerfile → server e web), construídas como o Coolify faz. Sem este
    # job, um Dockerfile quebrado só aparecia no deploy (G3, trilha F2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem server (API, worker, migrations e backup)
        run: docker build --progress=plain --target server -t aluguei-server:ci .

      - name: pg_dump e pg_restore 17 na imagem server
        run: |
          docker run --rm aluguei-server:ci sh -c '"$PG_DUMP" --version && "$PG_RESTORE" --version'
          docker run --rm aluguei-server:ci sh -c 'test -d /backups && test -w /backups && echo "/backups gravável pelo $(id -un)"'

      - name: Build da imagem web
        run: docker build --progress=plain --target web -t aluguei-web:ci .

      - name: Build da imagem portal
        run: docker build --progress=plain --target portal --build-arg PORTAL_BASE_URL=https://build.teste -t aluguei-portal:ci .

      - name: Portal sobe e responde (pega quebra na carga do módulo)
        run: |
          docker run -d --name portal-ci -p 3100:3100 -e PORTAL_BASE_URL= aluguei-portal:ci
          for tentativa in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/robots.txt > /dev/null; then
              echo "portal respondeu na tentativa $tentativa"
              docker rm -f portal-ci
              exit 0
            fi
            sleep 2
          done
          echo "portal não respondeu; log do contêiner:"
          docker logs portal-ci
          docker rm -f portal-ci
          exit 1

      # Duas metades da mesma regra, e a primeira implantação em achouimovel.online quebrou nas duas:
      # a pagina publica e gerada no build e leva o ARG; robots.txt roda por
      # requisicao e leva a variavel de ambiente. A imagem acima foi construida
      # com https://build.teste; o conteiner sobe com outro endereco.
      - name: Portal usa o endereço do build na página e o do ambiente na rota
        run: |
          docker run -d --name portal-url-ci -p 3101:3100 -e PORTAL_BASE_URL=https://exec.teste aluguei-portal:ci
          for tentativa in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3101/robots.txt > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          robots=$(curl -sS http://127.0.0.1:3101/robots.txt)
          codigo_home=$(curl -s -o home.html -w '%{http_code}' http://127.0.0.1:3101/)
          echo "--- robots.txt ---"
          echo "$robots"
          echo "--- home: HTTP $codigo_home ---"
          grep -o '<link rel="canonical"[^>]*>' home.html || head -c 400 home.html
          if [ "$codigo_home" != "200" ]; then
            echo "log do contêiner:"
            docker logs portal-url-ci
          fi
          docker rm -f portal-url-ci
          case "$robots" in
            *"https://exec.teste/sitemap.xml"*) echo "rota usou o ambiente" ;;
            *) echo "FALHA: robots.txt não usou PORTAL_BASE_URL do ambiente"; exit 1 ;;
          esac
          if ! grep -q 'https://build.teste/' home.html; then
            echo "FALHA: a canônica da home não veio do ARG PORTAL_BASE_URL"
            exit 1
          fi
          echo "página usou o endereço do build"
