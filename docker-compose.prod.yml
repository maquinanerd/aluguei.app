# Homologação do Aluguei.app no Coolify (build pack "Docker Compose").
#
# - Banco: recurso PostgreSQL próprio do Coolify, com backup agendado. A URL
#   (com a senha) existe só na variável DATABASE_URL do recurso. O banco embutido
#   da primeira implantação saiu do compose depois do corte (ADR-062); o volume
#   `aluguei-pgdata`, com os dados dele, fica guardado pelo serviço `legacy-pgdata`.
# - Storage: MinIO (build comunitária mantida pelo Coolify) neste compose, com
#   credenciais geradas pelo Coolify e compartilhadas com a API. O navegador
#   envia o arquivo direto para o domínio público do MinIO, em path-style.
# - Segredos: variáveis mágicas do Coolify (SERVICE_PASSWORD_*, SERVICE_USER_*,
#   SERVICE_HEX_*). Nenhum valor fica no repositório.
# - Domínios: configurados no recurso. O sufixo numérico de
#   SERVICE_URL_<SERVIÇO>_<PORTA> diz ao proxy para qual porta rotear — o
#   Coolify descarta porta escrita no próprio domínio.
# - APP_BASE_URL, API_BASE_URL e STORAGE_ENDPOINT: variáveis do recurso, iguais
#   aos domínios HTTPS de web, api e minio. O web recusa API_BASE_URL sem https
#   (auditoria P1-15), então fala com a API pelo domínio público.
# - Providers em FAKE / dry-run / mock: nenhuma cobrança, assinatura, consulta de
#   crédito, mensagem ou publicação real.
# - Sem REDIS_URL: com ela preenchida a API cai no boot (auditoria P1-14).
#
# Ver docs/DEPLOY_COOLIFY.md.

services:
  # Guarda o volume do banco embutido da primeira implantação (ADR-062): monta só para
  # leitura e termina na hora. Sem um serviço que o use, o Docker Compose descarta o
  # volume do modelo e ele deixaria de aparecer no recurso do Coolify.
  legacy-pgdata:
    image: busybox:1.36
    command: ['true']
    volumes:
      - aluguei-pgdata:/legacy-pgdata:ro
    restart: 'no'
    exclude_from_hc: true

  # Aplica as migrations e termina. A API e o worker só sobem se ela concluir.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    command: ['node', 'packages/db/scripts/apply-migrations.mjs']
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: 'no'
    exclude_from_hc: true

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      SERVICE_URL_MINIO_9000: ''
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
      MINIO_SERVER_URL: ${STORAGE_ENDPOINT}
    volumes:
      - aluguei-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 20s
      retries: 10

  # Garante o bucket privado e termina (idempotente).
  storage-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    command: ['node', '--import', 'tsx', 'packages/storage/src/ensure-bucket.cli.ts']
    environment:
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: aluguei-private
      STORAGE_FORCE_PATH_STYLE: 'true'
      STORAGE_ACCESS_KEY_ID: ${SERVICE_USER_MINIO}
      STORAGE_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_MINIO}
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    exclude_from_hc: true

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    command: ['node', '--import', 'tsx', 'apps/api/src/index.ts']
    environment:
      SERVICE_URL_API_4000: ''
      NODE_ENV: production
      LOG_LEVEL: info
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      DATABASE_URL: ${DATABASE_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      CORS_ORIGINS: ${APP_BASE_URL}
      COOKIE_SECURE: 'true'
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: aluguei-private
      STORAGE_FORCE_PATH_STYLE: 'true'
      STORAGE_ACCESS_KEY_ID: ${SERVICE_USER_MINIO}
      STORAGE_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_MINIO}
      PAYMENT_PROVIDER: FAKE
      SIGNATURE_PROVIDER: FAKE
      SCREENING_PROVIDER: FAKE
      META_MODE: dry_run
      AI_PROVIDER: mock
      # Homologação: em produção a API recusa FAKE, mock e dry_run sem esta permissão.
      ALLOW_FAKE_PROVIDERS: 'true'
      SIGNATURE_WEBHOOK_TOKEN: ${SERVICE_HEX_64_SIGNATUREWEBHOOK}
      ASAAS_WEBHOOK_TOKEN: ${SERVICE_HEX_64_ASAASWEBHOOK}
      META_APP_SECRET: ${SERVICE_HEX_64_METAAPPSECRET}
      META_WEBHOOK_VERIFY_TOKEN: ${SERVICE_HEX_64_METAVERIFY}
      META_TOKEN_ENCRYPTION_KEY: ${SERVICE_HEX_64_METATOKENKEY}
      # Admins da plataforma (e-mails separados por vírgula); vazio: ninguém acessa /plataforma.
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    command: ['node', '--import', 'tsx', 'apps/worker/src/main.ts']
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: ${DATABASE_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      PAYMENT_PROVIDER: FAKE
      SIGNATURE_PROVIDER: FAKE
      SCREENING_PROVIDER: FAKE
      META_MODE: dry_run
      AI_PROVIDER: mock
      # Homologação: em produção o worker recusa FAKE, mock e dry_run sem esta permissão.
      ALLOW_FAKE_PROVIDERS: 'true'
      META_TOKEN_ENCRYPTION_KEY: ${SERVICE_HEX_64_METATOKENKEY}
      # Health HTTP só dentro do container (sem domínio): 200 com o loop saudável, 503 sem.
      WORKER_HEALTH_PORT: '4001'
      # No SIGTERM o worker espera os jobs em andamento até este limite (abaixo do stop_grace_period).
      WORKER_SHUTDOWN_TIMEOUT_MS: '20000'
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Backup do banco (G3, trilha F2): um pg_dump por dia às 06:00 UTC, cifrado com AES-256-GCM em
  # fluxo (o dump não toca o disco em claro), guardado no volume `aluguei-backups` com os 14 mais
  # novos. Sobe fazendo um backup se o último tiver mais de 24 h. O healthcheck fica vermelho sem
  # backup bom em 26 h. A chave vem do Coolify e precisa ser guardada fora do servidor: sem ela o
  # backup não abre. Restauração: docs/OPERATIONS.md.
  backup:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    command: ['node', '--import', 'tsx', 'packages/db/src/backup/cli.ts', 'schedule']
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_DIR: /backups
      BACKUP_ENCRYPTION_KEY: ${SERVICE_HEX_64_BACKUPKEY}
      BACKUP_KEEP: '14'
      BACKUP_HOUR_UTC: '6'
    volumes:
      - aluguei-backups:/backups
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const s = JSON.parse(require('fs').readFileSync('/backups/status.json', 'utf8')); process.exit(Date.now() - Date.parse(s.lastSuccessAt) < 26 * 3600e3 ? 0 : 1)",
        ]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 10m

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      SERVICE_URL_WEB_3000: ''
      NODE_ENV: production
      APP_BASE_URL: ${APP_BASE_URL}
      API_BASE_URL: ${API_BASE_URL}
      PUBLIC_ORG_SLUG: ${PUBLIC_ORG_SLUG:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Portal publico do AchouImovel. O dominio e gerado pelo Coolify
  # (docker_compose_domains); PORTAL_BASE_URL precisa bater com ele, porque e o
  # endereco que entra na canonica, no JSON-LD e no sitemap.
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: portal
    environment:
      SERVICE_URL_PORTAL_3100: ''
      NODE_ENV: production
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:3100}
      API_BASE_URL: ${API_BASE_URL}
      # Valor vazio quebraria a API: o Coolify repassa as variaveis do compose a
      # todos os servicos e o schema so aceita "true"/"false" (2026-09-24).
      API_BASE_URL_ALLOW_HTTP: ${API_BASE_URL_ALLOW_HTTP:-false}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/robots.txt').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  # Dados do banco embutido da primeira implantação, copiados para o banco próprio no
  # corte de 2026-09-15 (ADR-062). Apagar é irreversível e só com pedido explícito do usuário.
  aluguei-pgdata:
  aluguei-minio-data:
  # Backups cifrados do banco (serviço `backup`).
  aluguei-backups:
